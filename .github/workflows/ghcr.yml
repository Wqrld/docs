name: Build and publish OCI images

# Fork-only (Wqrld/docs, branch `office`): publishes the four images on every
# `v*-office.*` tag, as ghcr.io/wqrld/docs-<component>:<tag>, for the office
# platform. One tag pins the chart and every image.
"on":
  push:
    tags:
      - "v*-office.*"

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docs-backend
            file: Dockerfile
            target: backend-production
            docker_user: "1001:127"
          - image: docs-frontend
            file: src/frontend/Dockerfile
            target: frontend-production
            docker_user: "1001:127"
          - image: docs-y-provider
            file: src/frontend/servers/y-provider/Dockerfile
            target: y-provider
            docker_user: "1001:127"
          - image: docs-yhub
            file: src/yhub-server/Dockerfile
            target: yhub
            docker_user: "1000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # PUBLISH_AS_MIT=false is how upstream builds its images: without it the
          # frontend leaves out the BlockNote XL packages, so no PDF/DOCX/ODT export
          # and no multi-column blocks.
          build-args: |
            DOCKER_USER=${{ matrix.docker_user }}
            PUBLISH_AS_MIT=false
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
